    <script>
      // stamp the persisted theme before first paint so a dark pref never
      // flashes light; the app re-applies (and live-tracks 'auto') after boot
      try {
        var p = localStorage.getItem('worklog-theme-pref')
        if (p !== 'light' && p !== 'dark') {
          p = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = p
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
